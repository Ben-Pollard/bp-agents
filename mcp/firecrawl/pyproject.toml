[project]
name = "firecrawl-mcp"
version = "0.1.0"
description = "Standalone MCP server for web search, scraping, and extraction via Firecrawl."
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.8.0",
    "firecrawl-py>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firecrawl_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"