repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-unit-agents
        name: unit tests (agents)
        entry: uv run --directory agents pytest tests/unit
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-unit-firecrawl
        name: unit tests (firecrawl-mcp)
        entry: uv run --directory mcp/firecrawl pytest tests
        language: system
        pass_filenames: false
        types: [python]