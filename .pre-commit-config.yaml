repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-unit
        name: unit tests
        entry: uv run pytest tests/unit
        language: system
        pass_filenames: false
        types: [python]