services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bp_agents
      POSTGRES_PASSWORD: bp_agents_dev
      POSTGRES_DB: bp_agents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp_agents"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bp_agents

  egress-proxy:
    image: mitmproxy/mitmproxy:latest
    command: mitmweb --listen-host 0.0.0.0 --listen-port 8080 --web-host 0.0.0.0 --web-port 8081
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - bp_agents

  plane:
    image: makeplane/plane-aio-commercial:stable
    ports:
      - "8082:80"
    environment:
      - DATABASE_URL=postgresql://plane:plane_dev@plane-db:5432/plane
      - DOMAIN_NAME=localhost
      - SECRET_KEY=plane_secret_key_dev_only
      - PLANE_BASE_URL=http://localhost:8082
      - REDIS_URL=redis://plane-redis:6379
      - AMQP_URL=amqp://guest:guest@rabbitmq:5672
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=miniosecret
      - AWS_S3_BUCKET_NAME=plane
    entrypoint: >
      sh -c "
      sed -i 's/from mcp.client.streamable_http import streamablehttp_client/from mcp.client.streamable_http import streamable_http_client as streamablehttp_client/' /app/backend/plane/silo/services/mcp_connection.py &&
      exec /app/start.sh
      "
    depends_on:
      postgres:
        condition: service_healthy
plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - bp_agents

  plane-redis:
    image: redis:7
    networks:
      - bp_agents

  rabbitmq:
    image: rabbitmq:4-alpine
    networks:
      - bp_agents

  plane-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane_dev
      POSTGRES_DB: plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - plane_db_data:/var/lib/postgresql/data
    networks:
      - bp_agents

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/default-password.xml
    networks:
      - bp_agents

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "8083:3000"
    environment:
      DATABASE_URL: postgresql://bp_agents:bp_agents_dev@postgres:5432/bp_agents
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "clickhouse"
      NEXTAUTH_SECRET: langfuse_secret_dev_only
      SALT: langfuse_salt_dev_only
      NEXTAUTH_URL: http://localhost:8083
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    networks:
      - bp_agents

  orchestrator:
    build: .
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/data/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      plane:
        condition: service_started
      langfuse:
        condition: service_started
      egress-proxy:
        condition: service_started
    networks:
      - bp_agents

volumes:
  postgres_data:
  plane_db_data:
  clickhouse_data:

networks:
  bp_agents: