services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bp_agents
      POSTGRES_PASSWORD: bp_agents_dev
      POSTGRES_DB: bp_agents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp_agents"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bp_agents

  egress-proxy:
    image: mitmproxy/mitmproxy:latest
    command: mitmweb --listen-host 0.0.0.0 --listen-port 8080 --web-host 0.0.0.0 --web-port 8081
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - bp_agents

  redmine:
    image: redmine:6
    ports:
      - "8082:3000"
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_PORT: 5432
      REDMINE_DB_USER: redmine
      REDMINE_DB_PASSWORD: redmine_dev
      REDMINE_DB_DATABASE: redmine
    depends_on:
      redmine-db:
        condition: service_healthy
    networks:
      - bp_agents

  redmine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine_dev
      POSTGRES_DB: redmine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    networks:
      - bp_agents

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/default-password.xml
    networks:
      - bp_agents

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "8083:3000"
    environment:
      DATABASE_URL: postgresql://bp_agents:bp_agents_dev@postgres:5432/bp_agents
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "clickhouse"
      NEXTAUTH_SECRET: langfuse_secret_dev_only
      SALT: langfuse_salt_dev_only
      NEXTAUTH_URL: http://localhost:8083
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    networks:
      - bp_agents

  orchestrator:
    build: .
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/data/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redmine:
        condition: service_started
      langfuse:
        condition: service_started
      egress-proxy:
        condition: service_started
    networks:
      - bp_agents

volumes:
  postgres_data:
  redmine_db_data:
  clickhouse_data:

networks:
  bp_agents: