services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bp_agents
      POSTGRES_PASSWORD: bp_agents_dev
      POSTGRES_DB: bp_agents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp_agents"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bp_agents

  egress-proxy:
    image: mitmproxy/mitmproxy:latest
    command: >
      mitmdump --listen-host 0.0.0.0 --listen-port 8080
      -s /scripts/egress_blocker.py
      --set ignore_hosts='.*'
    ports:
      - "8080:8080"
    volumes:
      - ./scripts:/scripts
    networks:
      - bp_agents

  redmine:
    image: redmine:6
    ports:
      - "8082:3000"
    environment:
      REDMINE_DB_POSTGRES: redmine-db
      REDMINE_DB_PORT: 5432
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine_dev
      REDMINE_DB_DATABASE: redmine
    depends_on:
      redmine-db:
        condition: service_healthy
    networks:
      - bp_agents

  redmine-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine_dev
      POSTGRES_DB: redmine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redmine_db_data:/var/lib/postgresql/data
    networks:
      - bp_agents

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/default-password.xml
    networks:
      - bp_agents

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "8083:3000"
    environment:
      DATABASE_URL: postgresql://bp_agents:bp_agents_dev@postgres:5432/bp_agents
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "clickhouse"
      NEXTAUTH_SECRET: langfuse_secret_dev_only
      SALT: langfuse_salt_dev_only
      NEXTAUTH_URL: http://localhost:8083
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
    networks:
      - bp_agents

  redmine-setup:
    build: .
    command: [".venv/bin/python", "scripts/bootstrap_redmine.py"]
    environment:
      REDMINE_URL: http://redmine:3000
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin
      BP_PROJECT_NAME: default
      BP_PROJECT_ID: default
      BP_ENV_OUTPUT: /data/env/.env
      REDMINE_CONTAINER: bp-agents-redmine-1
    volumes:
      - bp_env:/data/env
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redmine:
        condition: service_started
    networks:
      - bp_agents

  orchestrator:
    build: .
    environment:
      BP_TARGET_REPO_PATH: ${BP_TARGET_REPO_PATH:-/data/repos/default-project}
      BP_SANDBOX_IMAGE: ${BP_SANDBOX_IMAGE:-symphony-agent:latest}
      BP_SKILLS_PATH: ${BP_SKILLS_PATH:-/app/.agents/skills}
      BP_SANDBOX_RUNTIME: ${BP_SANDBOX_RUNTIME:-runsc}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/user/projects/bp-skills:/home/user/projects/bp-skills:ro
      - ./workspaces:/data/workspaces
      - bp_env:/data/env
      - ./.agents:/app/.agents:ro
      - ${BP_TARGET_REPO_PATH:-/data/repos/default-project}:${BP_TARGET_REPO_PATH:-/data/repos/default-project}:rw
    depends_on:
      postgres:
        condition: service_healthy
      redmine:
        condition: service_started
      redmine-setup:
        condition: service_completed_successfully
      langfuse:
        condition: service_started
      egress-proxy:
        condition: service_started
    networks:
      - bp_agents

volumes:
  postgres_data:
  redmine_db_data:
  clickhouse_data:
  bp_env:

networks:
  bp_agents:
    name: bp_agents