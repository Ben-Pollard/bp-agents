[project]
name = "bp-agents"
version = "0.1.0"
description = "A collection of personal agents"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "ben-pollard" }]
dependencies = ["httpx>=0.28"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bp_agents"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "F811", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["bp_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]